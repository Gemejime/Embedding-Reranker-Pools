name: CI - RAG Inference Serving

on:
  push:
    branches: [main, master, "rag-inference-serving", "feat/*", "fix/*"]
  pull_request:
    branches: [main, master, "rag-inference-serving"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project and Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Static Type Analysis (mypy)
        run: |
          mypy --config-file pyproject.toml .

  security-and-logging-audit:
    name: Secured Logging & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit for Hardcoded Secrets
        run: |
          echo "Scanning for accidental secrets or private keys..."
          if grep -rnE "BEGIN ((RSA|EC|OPENSSH|ENCRYPTED) )?PRIVATE KEY" . --exclude-dir={.git,.venv}; then
            echo "ERROR: Hardcoded private key detected!"
            exit 1
          fi

      - name: Verify Secured Logging Invariants
        run: |
          echo "Verifying no raw customer text or query payloads in logging statements..."
          # Ensure logger calls do not log raw queries or raw document chunks
          python -c '
          import os, re, sys
          suspicious = re.compile(r"log(ger)?\.(info|debug|warning|error)\(.*(query_text|raw_chunk|raw_text|bearer_token|presigned_url).*\)", re.IGNORECASE)
          violations = 0
          for root, _, files in os.walk("."):
              if any(d in root for d in [".git", ".venv", "tasks", "__pycache__"]):
                  continue
              for f in files:
                  if f.endswith(".py"):
                      path = os.path.join(root, f)
                      with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                          for idx, line in enumerate(fh, 1):
                              if suspicious.search(line):
                                  print(f"FAILED: Potential unredacted log emission at {path}:{idx}: {line.strip()}")
                                  violations += 1
          if violations > 0:
              sys.exit(1)
          print("Secured logging check passed cleanly.")
          '

      - name: Set up Python for Drift Check
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify Environment and Deployment Drift Zero-State
        run: |
          cat << 'EOF' > .env.ci
          ENVIRONMENT=production
          PYTHONUNBUFFERED=1
          PYTHONDONTWRITEBYTECODE=1
          RAG_SERVING_POOL_TYPE=online_embedding
          RAG_SERVING_SERVER_HOST=0.0.0.0
          RAG_SERVING_SERVER_PORT=8080
          RAG_SERVING_TRITON_HTTP_URL=http://127.0.0.1:8000
          RAG_SERVING_TRITON_GRPC_URL=127.0.0.1:8001
          RAG_SERVING_ONLINE_EMBED_GRPC_URL=dns:///rag-inference-online-embedding-headless.rag-inference-serving.svc.cluster.local:8001
          RAG_SERVING_ONLINE_RERANK_GRPC_URL=dns:///rag-inference-online-reranker-headless.rag-inference-serving.svc.cluster.local:8001
          RAG_SERVING_BATCH_INGEST_GRPC_URL=dns:///rag-inference-batch-ingestion-headless.rag-inference-serving.svc.cluster.local:8001
          RAG_SERVING_MAX_QUEUE_DELAY_MICROSECONDS=2000
          RAG_SERVING_MAX_BATCH_SIZE=32
          RAG_SERVING_VRAM_CAPACITY_BYTES=25769803776
          RAG_SERVING_MAX_STATIC_VRAM_BYTES=21474836480
          RAG_SERVING_VRAM_MAX_UTILIZATION_RATIO=0.85
          RAG_SERVING_SHM_BASE_PATH=/dev/shm
          RAG_SERVING_GRPC_TLS_ENABLED=false
          RAG_SERVING_GRPC_CA_CERT_PATH=
          RAG_SERVING_GRPC_CLIENT_CERT_PATH=
          RAG_SERVING_GRPC_CLIENT_KEY_PATH=
          RAG_SERVING_GRPC_SERVER_NAME_OVERRIDE=
          RAG_SERVING_LOG_LEVEL=INFO
          PROMETHEUS_SERVER_ADDRESS=http://prometheus-k8s.monitoring.svc:9090
          KAFKA_BOOTSTRAP_SERVERS=kafka.event-streaming.svc:9092
          KAFKA_CONSUMER_GROUP=rag-batch-embedder-group
          KAFKA_TOPIC=rag.ingestion.chunks
          KAFKA_SASL_MECHANISM=SCRAM-SHA-512
          KAFKA_SECURITY_PROTOCOL=SASL_SSL
          KAFKA_SSL_CA_LOCATION=/etc/ssl/certs/kafka-ca.crt
          AWS_DEFAULT_REGION=us-east-1
          AWS_ENDPOINT_URL=
          MODEL_REGISTRY_STORAGE_URI=s3://rag-model-cache/tensorrt-engines/
          MODEL_REPOSITORY=/models
          TRITON_ARGS="--strict-model-config=true --log-verbose=0"
          LIVE_TRITON=0
          EOF
          python scripts/sync_env_to_deployments.py --env-file .env.ci --check-only

  triton-config-lint:
    name: Triton Model Repository & Config Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Triton Repository Structure
        run: |
          echo "Checking Triton model config files and dynamic batching parameters..."
          python -c '
          import os, glob, sys
          configs = glob.glob("config/triton/**/config.pbtxt", recursive=True)
          if not configs:
              print("Notice: No config.pbtxt files discovered yet during scaffold phase.")
              sys.exit(0)
          
          required_tokens = ["max_batch_size", "dynamic_batching", "max_queue_delay_microseconds"]
          missing = 0
          for cfg in configs:
              with open(cfg, "r") as f:
                  content = f.read()
              for tok in required_tokens:
                  if tok not in content and "text_tokenizer" not in cfg and "ensemble" not in cfg:
                      print(f"ERROR: {cfg} missing dynamic batching property {tok}")
                      missing += 1
          if missing > 0:
              print(f"FAILED: Found {missing} missing dynamic batching property violation(s).")
              sys.exit(1)
          print(f"Validated {len(configs)} Triton config file(s).")
          '

  openapi-contract-check:
    name: OpenAPI 3.1 & Doc API Contract Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate OpenAPI Specifications
        run: |
          python -c '
          import os, json, sys
          schema_path = os.path.join("api", "openapi", "openapi.json")
          if os.path.exists(schema_path):
              with open(schema_path, "r", encoding="utf-8") as f:
                  schema = json.load(f)
              assert schema.get("openapi", "").startswith("3."), "OpenAPI must be version 3.x"
              assert "paths" in schema, "OpenAPI missing paths"
              doc_paths = list(schema["paths"].keys())
              print(f"OpenAPI 3.1 validation succeeded. Documented paths: {doc_paths}")
          else:
              print(f"Notice: {schema_path} will be checked once instantiated.")
          '

  test-suites:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest Suites
        run: |
          if [ -d "test" ]; then
            pytest -v test/
          else
            echo "Test directory not yet present; skipping."
          fi

  helm-lint:
    name: Helm Chart Validation & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.14.0

      - name: Lint Helm Charts
        run: |
          if [ -d "deployments/helm" ]; then
            helm lint deployments/helm
          else
            echo "Helm charts not yet deployed in deployments/helm; skipping."
          fi
