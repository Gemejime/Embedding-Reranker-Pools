apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: triton-vram-and-latency-check
  namespace: rag-inference-serving
  labels:
    app.kubernetes.io/name: rag-inference-serving
    app.kubernetes.io/part-of: enterprise-rag-platform
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.99
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc:9090
          query: |
            sum(rate(nv_inference_request_success{job="{{args.service-name}}"}[1m]))
            /
            clamp_min(sum(rate(nv_inference_request_success{job="{{args.service-name}}"}[1m])) + sum(rate(nv_inference_request_failure{job="{{args.service-name}}"}[1m])), 0.001)
    - name: p99-queue-latency
      interval: 30s
      successCondition: result[0] <= 10000
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc:9090
          query: |
            sum(rate(nv_inference_queue_duration_us{job="{{args.service-name}}"}[1m]))
            /
            clamp_min(sum(rate(nv_inference_count{job="{{args.service-name}}"}[1m])), 0.001)
