# Prerequisite Secret manifest for ArgoCD deployments.
# Uses ArgoCD PreSync hook and sync-wave 0 to ensure secrets exist before
# inference pools in sync-wave 1 start, avoiding CreateContainerConfigError.
apiVersion: v1
kind: Secret
metadata:
  name: rag-inference-secrets
  namespace: rag-inference-serving
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PreSync
type: Opaque
# Runtime and trigger credentials (HF_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# RAG_SERVING_API_KEY, KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD) are managed and injected
# via Secret provider / CI deploy workflow to prevent overwriting active cluster credentials.
data: {}
