apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: rag-inference-serving
    app.kubernetes.io/instance: {{ .Release.Name }}
    rag.enterprise.internal/pool: {{ .Values.poolType }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: rag-inference-serving
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: triton-grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: triton-grpc
      protocol: TCP
    - name: triton-http
      port: {{ .Values.service.httpPort }}
      targetPort: triton-http
      protocol: TCP
    - name: triton-metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: triton-metrics
      protocol: TCP
    - name: operational
      port: {{ .Values.service.operationalPort }}
      targetPort: operational
      protocol: TCP
