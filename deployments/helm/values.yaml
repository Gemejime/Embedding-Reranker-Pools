# Default values for rag-inference-serving
poolType: online_embedding

image:
  repository: enterprise-rag/rag-inference-serving
  pullPolicy: IfNotPresent
  tag: "1.0.0"

replicaCount: 4

resources:
  limits:
    nvidia.com/gpu: 1
    cpu: "8"
    memory: "32Gi"
  requests:
    nvidia.com/gpu: 1
    cpu: "4"
    memory: "16Gi"

service:
  type: ClusterIP
  grpcPort: 8001
  httpPort: 8000
  metricsPort: 8002
  operationalPort: 8080

shmVolume:
  enabled: true
  sizeLimit: 8Gi

modelStorage:
  persistentVolumeClaimName: rag-model-engines-pvc
  mountPath: /models
  readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: true
  minReplicaCount: 4
  maxReplicaCount: 8
  cooldownPeriod: 60
  pollingInterval: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-k8s.monitoring.svc:9090
        metricName: triton_queue_duration_microseconds
        threshold: "3000"
        query: sum(rate(triton_queue_duration_microseconds{pool="online_embedding"}[1m])) / clamp_min(sum(rate(triton_inference_count{pool="online_embedding"}[1m])), 1)

env:
  RAG_SERVING_POOL_TYPE: "online_embedding"
  RAG_SERVING_MAX_QUEUE_DELAY_MICROSECONDS: "2000"
  RAG_SERVING_MAX_BATCH_SIZE: "32"
  RAG_SERVING_SERVER_PORT: "8080"
